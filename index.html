<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1fa; --panel:#ffffff; --ink:#1b1f3b; --mute:#6a6f8f; --line:#e1e5f3;
    --hero:#2a2d8c; --hero-ink:#ffffff; --hero-soft:rgba(255,255,255,.16);
    --ok:#0f9d73; --ok-bg:#dff5ec; --no:#e2503a; --no-bg:#fde6e1; --sun:#ffc83d;
    --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#10122a; --panel:#191c3c; --ink:#eceefc; --mute:#9a9fc6; --line:#2a2e58;
    --hero:#3a3eb5; --ok:#3ddba7; --ok-bg:#123a30; --no:#ff8a76; --no-bg:#43211d;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
  main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
  button,input{font:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  /* Hero */
  .hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:22px 22px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .hero h1{font:800 clamp(26px,6vw,36px)/1.05 var(--head);margin:0 0 6px;letter-spacing:-.02em}
  .hero .sub{margin:0;opacity:.8;font-size:14px}
  .daynav{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
  .daynav button{width:36px;height:36px;border-radius:50%;border:0;background:var(--hero-soft);color:#fff;font-size:18px}
  .daynav input{background:var(--hero-soft);color:#fff;border:0;border-radius:999px;padding:8px 14px;color-scheme:dark}
  .daynav .today{width:auto;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;background:var(--sun);color:#2a2400}
  .ring{position:relative;width:112px;height:112px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .bg{stroke:var(--hero-soft)} .ring .fg{stroke:var(--sun);transition:stroke-dashoffset .5s ease}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--head)}
  .ring small{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;opacity:.8}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .stat{background:var(--panel);border-radius:18px;padding:12px 14px;border:1px solid var(--line)}
  .stat b{display:block;font:800 26px/1 var(--head)}
  .stat span{font-size:13px;color:var(--mute)}
  .stat.p b{color:var(--ok)} .stat.a b{color:var(--no)}

  /* Add + toolbar */
  .add{display:flex;gap:8px;margin-bottom:12px}
  .add input,.search{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .btn{padding:12px 20px;border-radius:999px;border:0;background:var(--hero);color:#fff;font-weight:700}
  .btn.light{background:var(--panel);color:var(--hero);border:1px solid var(--line)}
  @media(prefers-color-scheme:dark){.btn.light{color:var(--ink)}}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tabs{display:flex;gap:6px;overflow-x:auto}
  .tabs button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
  .tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  /* Rows */
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 12px;transition:background .2s}
  li.present{background:var(--ok-bg);border-color:transparent}
  li.absent{background:var(--no-bg);border-color:transparent}
  .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px var(--head);flex:none}
  .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tg{display:flex;gap:6px}
  .tg button{border:2px solid var(--line);background:var(--panel);color:var(--mute);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
  .tg .p.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .tg .a.on{background:var(--no);border-color:var(--no);color:#fff}
  .x{border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;padding:4px 8px;border-radius:50%}
  .empty{text-align:center;color:var(--mute);padding:36px 16px;background:var(--panel);border:2px dashed var(--line);border-radius:20px}
  .skel{height:62px;border-radius:20px;background:var(--panel);opacity:.6;animation:pulse 1.2s infinite alternate}
  @keyframes pulse{to{opacity:.25}}
  @media(prefers-reduced-motion:reduce){.skel{animation:none}.ring .fg{transition:none}}

  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.bad{background:var(--no);color:#fff}
  @media(max-width:480px){
    .tg button{padding:6px 10px}.hero{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <h1 id="dayTitle">Roll call</h1>
      <p class="sub" id="status">Connecting…</p>
      <div class="daynav">
        <button id="prev" aria-label="Previous day">‹</button>
        <input id="date" type="date" aria-label="Choose date">
        <button id="next" aria-label="Next day">›</button>
        <button id="today" class="today">Today</button>
      </div>
    </div>
    <div class="ring" aria-label="Attendance rate">
      <svg width="112" height="112" viewBox="0 0 112 112">
        <circle class="bg" cx="56" cy="56" r="46" fill="none" stroke-width="10"/>
        <circle class="fg" id="fg" cx="56" cy="56" r="46" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/>
      </svg>
      <b id="pct">0%</b>
    </div>
  </section>

  <section class="stats">
    <div class="stat p"><b id="sP">0</b><span>Present</span></div>
    <div class="stat a"><b id="sA">0</b><span>Absent</span></div>
    <div class="stat"><b id="sU">0</b><span>Not marked</span></div>
  </section>

  <form class="add" id="addForm">
    <input id="name" placeholder="Add a student" aria-label="Student name" maxlength="60" autocomplete="off">
    <button class="btn" type="submit">Add</button>
  </form>

  <div class="tools">
    <input class="search" id="q" placeholder="Search" aria-label="Search students">
    <button class="btn light" id="all">Mark all present</button>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="present" aria-pressed="false">Present</button>
    <button data-f="absent" aria-pressed="false">Absent</button>
    <button data-f="none" aria-pressed="false">Not marked</button>
  </div>

  <ul id="list" style="margin-top:12px"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
  // Your Lambda Function URL (no trailing slash)
  const API = "https://pchkg2dhik5gp54vod2qg4pc740npxou.lambda-url.eu-north-1.on.aws";

  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  let students = [], records = {}, filter = "all", loaded = false, busy = 0;
  $("date").value = iso(new Date());

  function toast(msg, bad) {
    const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 2200);
  }

  async function api(path, method = "GET", body) {
    const r = await fetch(API + path, {
      method, headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    return r.json();
  }

  async function load() {
    if (busy) return;
    try {
      const date = $("date").value;
      const [s, r] = await Promise.all([api("/students"), api("/attendance/" + date)]);
      if (date !== $("date").value) return;
      students = s.sort((a, b) => a.localeCompare(b)); records = r; loaded = true;
      $("status").textContent = "Synced. Updates every 30 seconds.";
      render();
    } catch (e) { $("status").textContent = "Offline. Check your API URL."; toast("Cannot load: " + e.message, true); }
  }

  const hue = n => [...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const initials = n => n.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

  function render() {
    $("dayTitle").textContent = parse($("date").value).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
    const P = students.filter(n => records[n] === 'present').length;
    const A = students.filter(n => records[n] === 'absent').length;
    const total = students.length, rate = total ? Math.round(P / total * 100) : 0;
    $("sP").textContent = P; $("sA").textContent = A; $("sU").textContent = total - P - A;
    $("pct").textContent = rate + "%";
    $("fg").style.strokeDashoffset = 289 - 289 * rate / 100;

    const q = $("q").value.trim().toLowerCase();
    const shown = students.filter(n =>
      n.toLowerCase().includes(q) &&
      (filter === "all" || (filter === "none" ? !records[n] : records[n] === filter)));

    if (!loaded) return;
    $("list").innerHTML = shown.length ? shown.map(n => `
      <li class="${records[n] || ''}">
        <div class="av" style="background:hsl(${hue(n)} 55% 45%)" aria-hidden="true">${esc(initials(n))}</div>
        <div class="nm">${esc(n)}</div>
        <div class="tg">
          <button class="p ${records[n]==='present'?'on':''}" data-n="${esc(n)}" data-s="present" aria-pressed="${records[n]==='present'}">Present</button>
          <button class="a ${records[n]==='absent'?'on':''}" data-n="${esc(n)}" data-s="absent" aria-pressed="${records[n]==='absent'}">Absent</button>
        </div>
        <button class="x" data-del="${esc(n)}" aria-label="Remove ${esc(n)}">×</button>
      </li>`).join("")
      : `<li class="empty" style="display:block">${students.length ? "No students match this filter." : "No students yet. Add your first student above."}</li>`;
  }

  async function run(fn, okMsg) {
    busy++;
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) { toast("Save failed: " + e.message, true); }
    finally { busy--; load(); }
  }

  $("addForm").onsubmit = e => {
    e.preventDefault();
    const name = $("name").value.trim(); if (!name) return;
    $("name").value = "";
    run(() => api("/students", "POST", { name }), "Added " + name);
  };

  $("list").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.del) {
      if (!confirm("Remove " + b.dataset.del + " from the class?")) return;
      return run(() => api("/students/" + encodeURIComponent(b.dataset.del), "DELETE"), "Removed");
    }
    const { n, s } = b.dataset, date = $("date").value;
    records[n] = s; render();                       // instant feedback
    run(() => api("/attendance/" + date, "PUT", { name: n, status: s }));
  });

  $("all").onclick = () => {
    const date = $("date").value, todo = students.filter(n => records[n] !== 'present');
    if (!todo.length) return toast("Everyone is already present");
    todo.forEach(n => records[n] = 'present'); render();
    run(() => Promise.all(todo.map(n => api("/attendance/" + date, "PUT", { name: n, status: "present" }))), "Marked all present");
  };

  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("q").addEventListener("input", render);

  const shift = n => { const d = parse($("date").value); d.setDate(d.getDate() + n); $("date").value = iso(d); change(); };
  const change = () => { records = {}; render(); load(); };
  $("prev").onclick = () => shift(-1);
  $("next").onclick = () => shift(1);
  $("today").onclick = () => { $("date").value = iso(new Date()); change(); };
  $("date").addEventListener("change", change);

  load();
  // Refresh every 30s, and only while the tab is visible (keeps Lambda usage inside the free tier)
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
